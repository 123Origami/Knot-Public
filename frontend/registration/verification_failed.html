{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Verification Failed - Knot</title>
    <script src="{% static 'js/theme-bootstrap.js' %}"></script>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link rel="stylesheet" href="{% static 'components.css' %}">
</head>
<body>
    <section class="auth-section">
        <div class="container">
            <div class="auth-container">
                <div class="auth-header">
                    <i class="fas fa-times-circle" style="font-size: 4rem; color: #fc8181;"></i>
                    <h1>Verification Failed</h1>
                    <p>The verification token is invalid or has expired after 30 minutes.</p>
                </div>
                <div class="auth-card">
                    <div style="text-align: center; padding: 2rem;">
                        <p>Please request a new verification email:</p>
                        <a href="{% url 'resend_verification' %}" class="btn btn-primary">Resend Verification Email</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

</body>
</html>

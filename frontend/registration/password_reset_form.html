{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - Knot</title>
    <script src="{% static 'js/theme-bootstrap.js' %}"></script>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link rel="stylesheet" href="{% static 'components.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="{% url 'index' %}" class="logo"><i class="fas fa-link"></i> Knot</a>
            <ul class="nav-menu">
                <li><a href="{% url 'login' %}" class="btn-login">Back to Login</a></li>
            </ul>
        </div>
    </nav>

    <section class="auth-section">
        <div class="container">
            <div class="auth-container" style="max-width: 560px;">
                <div class="auth-header">
                    <h1>Create New Password</h1>
                    <p>Your new password must be at least 8 characters long.</p>
                </div>

                <div class="auth-card">
                    {% if messages %}
                    <div class="messages" style="margin-bottom: 1rem;">
                        {% for message in messages %}
                        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                        {% endfor %}
                    </div>
                    {% endif %}

                    <form method="post" action="{% url 'reset_password' token=token %}" class="auth-form">
                        {% csrf_token %}

                        <div class="form-group">
                            <label for="newPassword"><i class="fas fa-lock"></i> New Password</label>
                            <input type="password" id="newPassword" name="new_password" class="form-input" minlength="8" required>
                        </div>

                        <div class="form-group">
                            <label for="confirmPassword"><i class="fas fa-lock"></i> Confirm Password</label>
                            <input type="password" id="confirmPassword" name="confirm_password" class="form-input" minlength="8" required>
                        </div>

                        <button type="submit" class="btn btn-primary btn-block">
                            <i class="fas fa-key"></i> Update Password
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </section>
</body>
</html>

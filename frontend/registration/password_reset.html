{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Knot</title>
    <script src="{% static 'js/theme-bootstrap.js' %}"></script>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link rel="stylesheet" href="{% static 'components.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="{% url 'index' %}" class="logo"><i class="fas fa-link"></i> Knot</a>
            <ul class="nav-menu">
                <li><a href="{% url 'login' %}" class="btn-login">Back to Login</a></li>
            </ul>
        </div>
    </nav>

    <section class="auth-section">
        <div class="container">
            <div class="auth-container" style="max-width: 560px;">
                <div class="auth-header">
                    <h1>Reset Your Password</h1>
                    <p>Enter your email and we will send you a reset link.</p>
                </div>

                <div class="auth-card">
                    {% if messages %}
                    <div class="messages" style="margin-bottom: 1rem;">
                        {% for message in messages %}
                        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                        {% endfor %}
                    </div>
                    {% endif %}

                    <form method="post" action="{% url 'password_reset' %}" class="auth-form">
                        {% csrf_token %}
                        <div class="form-group">
                            <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
                            <div class="input-with-icon">
                                <i class="fas fa-at"></i>
                                <input type="email" id="email" name="email" class="form-input" placeholder="Enter your account email" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-block">
                            <i class="fas fa-paper-plane"></i> Send Reset Link
                        </button>

                        <div class="auth-footer">
                            <p>Remembered your password? <a href="{% url 'login' %}">Login here</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>New Admin Request - Knot</title>
    <style>
        body { font-family: 'Poppins', Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 20px auto; background: white; border-radius: 12px; overflow: hidden; }
        .header { background: linear-gradient(135deg, #ffebf3 0%, #fff5f9 100%); padding: 30px; text-align: center; }
        .content { padding: 30px; }
        .button { display: inline-block; padding: 12px 24px; background: #ffebf3; color: #2d3748; 
                  text-decoration: none; border-radius: 8px; margin: 10px; border: 2px solid #f8d0e0; }
        .info-box { background: #f8f9fa; padding: 20px; border-radius: 8px; margin: 20px 0; }
        .footer { text-align: center; padding: 20px; background: #f8f9fa; color: #718096; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>🔔 New Admin Request</h2>
        </div>
        <div class="content">
            <p>Hello {{ admin.username }},</p>
            <p><strong>{{ requesting_user.username }}</strong> has requested admin access.</p>
            
            <div class="info-box">
                <h3>Request Details:</h3>
                <p><strong>User:</strong> {{ requesting_user.username }}</p>
                <p><strong>Email:</strong> {{ requesting_user.email }}</p>
                <p><strong>Request Date:</strong> {{ request_date }}</p>
                <p><strong>Reason:</strong> {{ reason }}</p>
            </div>
            
            <div style="text-align: center;">
                <a href="{{ review_link }}" class="button">Review Request</a>
            </div>
        </div>
        <div class="footer">
            <p>&copy; 2026 Knot Platform</p>
        </div>
    </div>
</body>
</html>
